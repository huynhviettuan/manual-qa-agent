services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa_local_only
      POSTGRES_DB: qa
    ports:
      - '5432:5432'
    volumes:
      - qa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qa']
      interval: 5s
      retries: 10

volumes:
  qa-pgdata:
