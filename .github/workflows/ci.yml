name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Live provider calls are never made in CI.
      QA_LIVE_LLM: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Browser for Phase 2 execution tests (real Playwright against the in-repo demo app).
      - run: pnpm --filter @qa/execution exec playwright install --with-deps chromium
      # Unit, mocked-provider contract, policy/tenancy, PGlite integration and browser tests.
      - run: pnpm test
      - run: pnpm eval
      - run: pnpm eval
        env:
          QA_LLM_PROVIDER: openai
      - run: pnpm eval
        env:
          QA_READINESS_PROVIDER: jev

  # The same suite against real PostgreSQL + pgvector. PGlite serializes queries, so only a real
  # server exercises concurrent run claims (FOR UPDATE SKIP LOCKED) and the node-postgres driver.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa_ci_only
          POSTGRES_DB: qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QA_LIVE_LLM: ''
      # Each test file creates and drops its own database on this server.
      QA_TEST_DATABASE_URL: postgres://qa:qa_ci_only@localhost:5432/qa
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qa/execution exec playwright install --with-deps chromium
      - run: pnpm test
